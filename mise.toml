[tools]
node = "22"
pnpm = "10"
lefthook = "2"
# For reading the Directus token from Secret Manager in `deploy`.
gcloud = "latest"
jq = "1"

[env]
# The org's deploy.yml sets PULUMI_STACK: dev for PR previews, prod for the live site. Locally it defaults to dev.
PULUMI_STACK = "{{ get_env(name='PULUMI_STACK', default='dev') }}"
FIREBASE_PROJECT = "cyc-admin-scripts"
FIREBASE_SITE = "csc-website"
DIRECTUS_URL = "{% if env.PULUMI_STACK == 'dev' %}https://directus.dev.cycsail.team{% else %}https://directus.cycsail.team{% endif %}"
DIRECTUS_TOKEN_SECRET = "{% if env.PULUMI_STACK == 'dev' %}dev-{% endif %}csc-website-directus-token"
# fixtures copies test/fixtures/. directus reads DIRECTUS_URL with DIRECTUS_TOKEN (AGENTS.md).
CONTENT_SOURCE = "{{ get_env(name='CONTENT_SOURCE', default='fixtures') }}"

[tasks.install]
description = "Install dependencies, git hooks, and the Chromium the smoke test runs in"
run = ["pnpm install", "lefthook install", "pnpm exec playwright install ${CI:+--with-deps} chromium"]

[tasks.pull]
description = "Write the content snapshot to .content/, from $CONTENT_SOURCE"
run = "node scripts/pull-content.ts"

[tasks.dev]
description = "Serve the site locally, reloading on change"
depends = ["pull"]
run = "pnpm exec astro dev"

[tasks.build]
description = "Build the site into dist/"
depends = ["pull"]
run = "pnpm exec astro build"

[tasks.preview]
description = "Serve the built site from dist/"
run = "pnpm exec astro preview"

# Needs gcloud credentials that can read the token and deploy to Firebase Hosting. Actions runs it; locally it's only
# for breaking glass.
[tasks.deploy]
description = "Build from $PULUMI_STACK's Directus and deploy: a PR's preview channel on dev, the live site on prod"
run = "./scripts/deploy.sh"

[tasks.format]
description = "Format and fix all files"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

# astro check typechecks the .astro files too. It reads the snapshot, so it pulls first.
[tasks.check]
description = "Typecheck, then check formatting and lint"
depends = ["pull"]
run = ["pnpm exec astro check", "pnpm exec prettier --check .", "pnpm exec eslint ."]

[tasks.test]
description = "Run unit tests"
run = "pnpm exec vitest run"

[tasks.smoke]
description = "Build, then visit every page in Chromium"
depends = ["build"]
run = "pnpm exec playwright test"

[tasks.screenshots]
description = "Save each page at laptop and phone sizes to screenshots/, from the built site"
run = "pnpm exec playwright test screenshots.spec.ts"
env = { SCREENSHOTS = "1" }

# One after another: check and build both write .astro/ and pull rewrites .content/.
[tasks.ci]
description = "Run all checks and tests"
run = ["mise run check", "mise run test", "mise run smoke"]
