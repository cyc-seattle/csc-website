name: pull-request

# A PR's push runs CI. A push to main deploys the live site from prod's Directus, once a maintainer approves. PRs
# don't deploy: deploy-website can deploy the live site, so only main gets its credentials (cyc-seattle/platform#280).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'push'
    uses: cyc-seattle/.github/.github/workflows/ci.yml@v3.4.0
  prod:
    if: github.event_name == 'push'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.4.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      task: deploy
