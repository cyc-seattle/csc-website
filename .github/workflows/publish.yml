name: publish

# Content builds: main's code with prod's Directus content, deployed live with no reviewer. A Directus Flow sends the
# `publish` dispatch when website content changes. The nightly run catches any change a Flow missed.
on:
  repository_dispatch:
    types: [publish]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.2.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: publish
      task: deploy
