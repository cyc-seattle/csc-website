name: publish

# Content builds: main's code with prod's Directus content, deployed live with no reviewer. Prod's Directus starts
# one when website content changes (cyc-seattle/csc-website#8). The nightly run catches any change it missed.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v4.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: publish
      task: deploy
